<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishna Icon Generator</title>
</head>

<body style="
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:#050816;
  color:white;
">

<button onclick="generateIcons()" style="
  padding:16px 25px;
  border:0;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
">
  Generate Krishna Icons
</button>

<script>
function drawIcon(size) {

  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");

  // Background
  const gradient = ctx.createRadialGradient(
    size / 2,
    size / 2,
    10,
    size / 2,
    size / 2,
    size
  );

  gradient.addColorStop(0, "#243b8f");
  gradient.addColorStop(1, "#050816");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  // Golden circle
  ctx.beginPath();
  ctx.arc(size / 2, size / 2, size * 0.36, 0, Math.PI * 2);
  ctx.fillStyle = "#f5c451";
  ctx.fill();

  // Krishna silhouette
  ctx.fillStyle = "#10152f";

  // Head
  ctx.beginPath();
  ctx.arc(
    size * 0.47,
    size * 0.39,
    size * 0.105,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Body
  ctx.beginPath();
  ctx.ellipse(
    size * 0.50,
    size * 0.58,
    size * 0.15,
    size * 0.25,
    0,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Flute
  ctx.save();

  ctx.translate(size * 0.31, size * 0.50);
  ctx.rotate(-0.08);

  ctx.fillRect(
    0,
    0,
    size * 0.38,
    size * 0.025
  );

  ctx.restore();

  // Peacock feather
  ctx.strokeStyle = "#10152f";
  ctx.lineWidth = size * 0.025;

  ctx.beginPath();
  ctx.moveTo(
    size * 0.45,
    size * 0.30
  );

  ctx.quadraticCurveTo(
    size * 0.50,
    size * 0.17,
    size * 0.57,
    size * 0.25
  );

  ctx.stroke();

  // Feather circle
  ctx.beginPath();
  ctx.arc(
    size * 0.56,
    size * 0.23,
    size * 0.035,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#f5c451";
  ctx.fill();

  // Decorative dots
  ctx.fillStyle = "#ffffff";

  for (let i = 0; i < 12; i++) {

    const angle = (Math.PI * 2 / 12) * i;

    const x =
      size / 2 +
      Math.cos(angle) * size * 0.43;

    const y =
      size / 2 +
      Math.sin(angle) * size * 0.43;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      size * 0.012,
      0,
      Math.PI * 2
    );

    ctx.fill();
  }

  return canvas;
}


function downloadCanvas(canvas, filename) {

  const link = document.createElement("a");

  link.download = filename;

  link.href = canvas.toDataURL("image/png");

  link.click();
}


function generateIcons() {

  const icon192 = drawIcon(192);
  const icon512 = drawIcon(512);

  downloadCanvas(
    icon192,
    "icon-192.png"
  );

  setTimeout(() => {

    downloadCanvas(
      icon512,
      "icon-512.png"
    );

  }, 500);

  alert(
    "दोनों icons generate हो गए हैं! अब इन्हें GitHub project में upload करो."
  );
}
</script>

</body>
</html>
